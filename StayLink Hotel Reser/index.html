/* ============================= ADMIN ALLOWLIST =============================
   Simple, capstone-appropriate admin check: any signed-in user whose email is
   in this list gets access to the Admin Dashboard. The SAME list is mirrored
   in firestore.rules so it's enforced server-side too, not just hidden in the UI.
   Add your group's real admin email(s) here before deploying. */
const ADMIN_EMAILS = ["admin@staylink.com"];

/* ============================= FIREBASE =============================
   NOTE ON TIMING: the Firebase SDK <script> tags in <head> use `defer`, so
   they only run once the whole document has been parsed — AFTER this inline
   script block would normally run. We don't touch `firebase.auth()` /
   `firebase.firestore()` until initApp() runs on DOMContentLoaded (see the
   bottom of this file), by which point the deferred scripts have executed. */
let fbReady = false, auth = null, db = null;

/* Room availability status + live counts, keyed by room id, synced from Firestore.
   Room *content* (name/desc/photos) stays in the ROOMS array above (acts as the
   catalog); Firestore only stores the parts that actually change at runtime:
   status, and reservations. This keeps the demo fast to seed while still being
   a real read/write backend for the transactional data. */
const roomStatus = {}; // { [roomId]: "Available" | "Occupied" | "Cleaning" }
ROOMS.forEach(r => roomStatus[r.id] = "Available");
const physicalRooms = [];
const adminRoomOverrides = {};

let myReservations = [];   // reservations belonging to the signed-in guest
let allReservations = [];  // every reservation (admin only)
let allUsers = [];          // guest directory (admin only)
let pendingBookingRoomId = null; // room the user was trying to book before we asked them to log in

function currentUser(){ return auth && auth.currentUser; }
function isAdmin(){
  const u = currentUser();
  return !!(u && u.email && ADMIN_EMAILS.includes(u.email));
}

function genReference(){
  return "SL-" + Math.floor(100000 + Math.random()*899999);
}
function physicalRoomPrefix(roomName){
  return String(roomName || "").replace(/\bRoom\b/gi, "").trim().split(/\s+/).filter(Boolean).map(word => word.charAt(0).toUpperCase()).join("");
}
function physicalRoomId(roomTypeId, number){ return `physical-${roomTypeId}-${number}`; }
function roomTypePhysicalRooms(roomTypeId){
  return physicalRooms.filter(room => String(room.roomTypeId) === String(roomTypeId));
}
async function ensurePhysicalRooms(){
  if (!fbReady || !isAdmin()) return;
  const existingSnapshots = await Promise.all(ROOMS.map(room =>
    db.collection("rooms").where("roomTypeId", "==", room.id).get()
  ));
  const batch = db.batch();
  let writes = 0;
  ROOMS.forEach((room, roomIndex) => {
    const prefix = physicalRoomPrefix(room.name);
    const existingIds = new Set(existingSnapshots[roomIndex].docs.map(doc => doc.id));
    for (let number = 1; number <= 5; number++) {
      const id = physicalRoomId(room.id, number);
      if (existingIds.has(id)) continue;
      batch.set(db.collection("rooms").doc(id), {
        roomTypeId: room.id,
        roomTypeName: room.name,
        roomNumber: `${prefix}-${number}`,
        status: "Available",
        bookings: [],
        visible: true,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge:true });
      writes++;
    }
  });
  if (writes) await batch.commit();
}
async function syncRoomTypeSummaries(){
  if (!fbReady || !isAdmin() || !physicalRooms.length) return;
  const batch = db.batch();
  let writes = 0;
  ROOMS.forEach(room => {
    const physical = roomTypePhysicalRooms(room.id);
    if (!physical.length) return;
    const available = physical.filter(item => (item.status || "Available") === "Available").length;
    const status = available > 0 ? "Available" : (physical.some(item => item.status === "Cleaning") ? "Cleaning" : "Occupied");
    const currentCount = Number(roomStatus[room.id+"_count"]);
    if (currentCount === available && roomStatus[room.id] === status) return;
    batch.set(db.collection("rooms").doc(String(room.id)), {
      availabilityCount: available,
      status,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge:true });
    writes++;
  });
  if (writes) await batch.commit();
}
async function syncRoomTypeSummary(roomTypeId){
  if (!fbReady || !isAdmin()) return;
  const physical = roomTypePhysicalRooms(roomTypeId);
  if (!physical.length) return;
  const available = physical.filter(item => (item.status || "Available") === "Available").length;
  await db.collection("rooms").doc(String(roomTypeId)).set({
    availabilityCount: available,
    status: available > 0 ? "Available" : (physical.some(item => item.status === "Cleaning") ? "Cleaning" : "Occupied"),
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  }, { merge:true });
}

/* ---- Firestore listeners (live-updating, so the dashboard reflects reality) ---- */
function attachRoomStatusListener(){
  if (!fbReady) return;
  db.collection("rooms").onSnapshot(snap => {
    physicalRooms.length = 0;
    snap.forEach(doc => {
      const data = doc.data();
      roomStatus[doc.id] = data.status || "Available";
      if (doc.data().availabilityCount != null) roomStatus[doc.id+"_count"] = doc.data().availabilityCount;
      if (data.roomTypeId != null && data.roomNumber) {
        physicalRooms.push({ id:doc.id, ...data });
      }
      if (data.price != null || data.visible != null) {
        adminRoomOverrides[doc.id] = { ...(adminRoomOverrides[doc.id] || {}), ...data };
      }
    });
    syncRoomTypeSummaries().catch(error => console.warn("room summary sync error:", error));
    render();
  }, err => console.warn("rooms listener error:", err));
}
function attachMyReservationsListener(){
  if (!fbReady) return;
  if (!currentUser()) { myReservations = []; return; }
  db.collection("reservations").where("guestUid","==",currentUser().uid)
    .onSnapshot(snap => {
      myReservations = snap.docs.map(d => ({ id:d.id, ...d.data() }))
        .sort((a,b)=> (b.createdAtMs||0) - (a.createdAtMs||0));
      processCompletedReservations();
      render();
    }, err => console.warn("my reservations listener error:", err));
}
async function processCompletedReservations(){
  if (!fbReady || !currentUser()) return;
  const today = new Date().toISOString().slice(0,10);
  for (const reservation of myReservations) {
    if (normalizedStatus(reservation.status) !== "confirmed" ||
        String(reservation.checkout || reservation.checkOut || "") >= today ||
        reservation.loyaltyPointsAwarded) continue;
    try {
      const reservationRef = db.collection("reservations").doc(reservation.id);
      const userRef = db.collection("users").doc(currentUser().uid);
      await db.runTransaction(async tx => {
        const [reservationSnap,userSnap] = await Promise.all([tx.get(reservationRef),tx.get(userRef)]);
        const current = reservationSnap.data() || {};
        if (current.loyaltyPointsAwarded || normalizedStatus(current.status) !== "confirmed") return;
        const profile = userSnap.data() || {};
        const points = Number(profile.loyaltyPoints || 0);
        const tier = tierForPoints(points);
        const earned = Math.floor((Number(current.total || current.totalPrice || 0) / 100) * tier.rate);
        const nextPoints = points + earned;
        tx.update(reservationRef,{status:"completed",loyaltyPointsAwarded:true,loyaltyPointsEarned:earned,loyaltyLockedAt:firebase.firestore.FieldValue.serverTimestamp(),updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
        tx.set(userRef,{loyaltyPoints:nextPoints,membership:tierForPoints(nextPoints).name,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
      });
    } catch (e) { console.warn("loyalty completion error:", e); }
  }
}
function attachAllReservationsListener(){
  if (!fbReady || !isAdmin()) return;
  db.collection("reservations").onSnapshot(snap => {
    allReservations = snap.docs.map(d => ({ id:d.id, ...d.data() }))
      .sort((a,b)=> (b.createdAtMs||0) - (a.createdAtMs||0));
    render();
  }, err => console.warn("all reservations listener error:", err));
}
function attachAllUsersListener(){
  if (!fbReady || !isAdmin()) return;
  db.collection("users").onSnapshot(snap => {
    allUsers = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    render();
  }, err => console.warn("all users listener error:", err));
}

/* ---- Writes ---- */
async function createReservation(room, detail, guestInfo){
  const nights = Math.max(1, Math.round((new Date(detail.checkout) - new Date(detail.checkin)) / 86400000));
  const subtotal = room.price * nights;
  const taxes = Math.round(subtotal * 0.12);
  const total = subtotal + taxes;
  const ref = genReference();
  const payload = {
    reference: ref,
    roomId: room.id,
    roomName: room.name,
    roomType: room.type,
    guestUid: currentUser().uid,
    guestName: guestInfo.name,
    guestEmail: guestInfo.email,
    checkin: detail.checkin,
    checkout: detail.checkout,
    nights, guests: detail.guests,
    subtotal, taxes, total,
    status: "confirmed",
    createdAtMs: Date.now(),
    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
  };
  await db.collection("reservations").add(payload);
  await db.collection("rooms").doc(String(room.id)).set({ status: "Occupied" }, { merge:true });
  return ref;
}
async function setReservationStatus(id, status){
  await db.collection("reservations").doc(id).update({ status });
}
async function setRoomStatus(roomId, status){
  await db.collection("rooms").doc(String(roomId)).set({ status }, { merge:true });
}

function navigate(v){
  if (v === "admin"){
    if (!currentUser()){ openAuth("login"); return; }
    if (!isAdmin()){ state.view = "admin-denied"; render(); return; }
    attachAllReservationsListener();
    state.view = "admin";
    render();
    window.scrollTo({top:0, behavior:"instant"});
    return;
  }
  if (v === "reservations" && !currentUser()){ openAuth("login"); return; }
  if (v !== "detail") state.selectedRoomId = null;
  state.view = v;
  render();
  window.scrollTo({top:0, behavior:"instant"});
}
function selectRoom(id){
  state.selectedRoomId = id;
  state.detail = { checkin:"2026-08-15", checkout:"2026-08-19", guests:2, tab:"overview" };
  state.view = "detail";
  render();
  window.scrollTo({top:0, behavior:"instant"});
}
async function handleBook(){
  const room = ROOMS.find(r=>r.id===state.selectedRoomId);
  if (!currentUser()){
    pendingBookingRoomId = room.id;
    openAuth("login");
    return;
  }
  const btn = document.getElementById('reserve-btn');
  if (btn){ btn.disabled = true; btn.textContent = "Confirming…"; }
  try {
    const ref = await createReservation(room, state.detail, {
      name: currentUser().displayName || currentUser().email,
      email: currentUser().email,
    });
    const toast = document.getElementById('toast');
    toast.querySelector('span') && (toast.querySelector('span').textContent = `Reservation confirmed · ${ref}`);
    toast.classList.remove('hidden'); toast.classList.add('flex');
    setTimeout(()=>{
      toast.classList.add('hidden'); toast.classList.remove('flex');
      state.selectedRoomId = null;
      state.view = "reservations";
      render();
      window.scrollTo({top:0, behavior:"instant"});
    }, 2200);
  } catch (e) {
    alert("Couldn't complete the reservation: " + e.message);
    if (btn){ btn.disabled = false; btn.textContent = "Reserve Now"; }
  }
}

function openAuth(mode){
  state.auth = { open:true, mode, name:"", email:"", password:"", error:"", loading:false };
  render();
}
function closeAuth(){
  state.auth.open = false;
  render();
}
function setAuthField(field, val){ state.auth[field] = val; }
function switchAuthMode(mode){ state.auth.mode = mode; state.auth.error=""; render(); }

async function submitAuth(){
  const a = state.auth;
  a.error = "";
  if (!a.email || !a.password || (a.mode==='signup' && !a.name)){
    a.error = "Please fill in all fields."; render(); return;
  }
  a.loading = true; render();
  try {
    if (a.mode === "signup"){
      const cred = await auth.createUserWithEmailAndPassword(a.email, a.password);
      await cred.user.updateProfile({ displayName: a.name });
    } else {
      await auth.signInWithEmailAndPassword(a.email, a.password);
    }
    state.auth.open = false;
    if (pendingBookingRoomId){
      const roomId = pendingBookingRoomId; pendingBookingRoomId = null;
      selectRoom(roomId);
      setTimeout(handleBook, 300);
    } else {
      render();
    }
  } catch (e) {
    a.loading = false;
    a.error = friendlyAuthError(e);
    render();
  }
}
function friendlyAuthError(e){
  const map = {
    "auth/email-already-in-use":"That email already has an account — try signing in instead.",
    "auth/invalid-email":"That email address doesn't look right.",
    "auth/weak-password":"Password should be at least 6 characters.",
    "auth/user-not-found":"No account found with that email.",
    "auth/wrong-password":"Incorrect password.",
    "auth/invalid-credential":"Incorrect email or password.",
  };
  return map[e.code] || e.message;
}
function signOut(){
  auth.signOut().then(()=>{ navigate('search'); });
}

async function enhancedCreateReservation(room,detail,guestInfo){
  if(!fbReady||!currentUser())throw new Error("Please sign in before booking.");
  const nights=Math.max(1,Math.round((new Date(detail.checkout)-new Date(detail.checkin))/86400000));if(nights<1)throw new Error("Check-out must be after check-in.");
  const extras={breakfast:!!detail.breakfast,spa:!!detail.spa},extrasPrice=(extras.breakfast?450:0)+(extras.spa?850:0),subtotal=room.price*nights,taxes=Math.round((subtotal+extrasPrice)*.12),total=subtotal+extrasPrice+taxes,ref=genReference(),reservationRef=db.collection("reservations").doc(),roomRef=db.collection("rooms").doc(String(room.id));
  await db.runTransaction(async tx=>{
    let assignedRoom=null;
    const physicalQuery=db.collection("rooms").where("roomTypeId","==",room.id);
    const physicalSnap=await tx.get(physicalQuery);
    const physicalAvailable=physicalSnap.docs.filter(doc => (doc.data().status || "Available") === "Available");
    const snap=await tx.get(roomRef),data=snap.exists?snap.data():{},count=physicalSnap.size ? physicalAvailable.length : Number(data.availabilityCount??room.availability??0);
    if(count<=0)throw new Error("Only 0 rooms left at this price.");
    const requestedStart=new Date(`${detail.checkin}T00:00:00`).getTime(), requestedEnd=new Date(`${detail.checkout}T00:00:00`).getTime();
    for(const physicalDoc of physicalAvailable){
      const physicalData=physicalDoc.data();
      if((physicalData.status||"Available")!=="Available")continue;
      const occupied=(physicalData.bookings||[]).some(item=>{
        const start=new Date(`${item.checkin}T00:00:00`).getTime(), end=new Date(`${item.checkout}T00:00:00`).getTime();
        return requestedStart<end && requestedEnd>start;
      });
      if(!occupied){assignedRoom={id:physicalDoc.id,...physicalData};break;}
    }
    if(!assignedRoom && physicalSnap.size)throw new Error(`Only ${count} room${count===1?"":"s"} left at this price.`);
    tx.set(roomRef,{availabilityCount:Math.max(0,count-1),status:count===1?"Occupied":"Available",updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
    if(assignedRoom){
      const assignedRef=db.collection("rooms").doc(assignedRoom.id);
      tx.update(assignedRef,{status:"Occupied",bookings:[...(assignedRoom.bookings||[]),{reservationId:reservationRef.id,checkin:detail.checkin,checkout:detail.checkout}],updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
    }
    tx.set(reservationRef,{reference:ref,reservationId:reservationRef.id,roomId:room.id,roomTypeId:room.id,roomTypeName:room.name,assignedRoomId:assignedRoom&&assignedRoom.id,assignedRoomNumber:assignedRoom&&assignedRoom.roomNumber,roomName:room.name,roomType:room.type,roomImage:room.img,destination:room.destination,location:room.location,guestUid:currentUser().uid,userId:currentUser().uid,guestName:guestInfo.name,leadGuest:guestInfo.name,guestEmail:guestInfo.email,contactNumber:guestInfo.contactNumber,checkin:detail.checkin,checkIn:detail.checkin,checkout:detail.checkout,checkOut:detail.checkout,checkinTime:detail.checkinTime||"15:00",nights,guests:detail.guests,extras,roomPrice:room.price,extrasPrice,subtotal,taxes,totalPrice:total,total,status:"confirmed",createdAtMs:Date.now(),createdAt:firebase.firestore.FieldValue.serverTimestamp(),updatedAt:firebase.firestore.FieldValue.serverTimestamp(),loyaltyPointsAwarded:false},{merge:false});
  });return ref;
}

/* ============================= RESERVATIONS VIEW (Firestore-backed) ============================= */
function renderReservationsView(){
  if (!currentUser()){
    return `<div class="pt-32 pb-28 px-6 max-w-md mx-auto text-center fade-in">

  }

  const upcoming = myReservations.filter(r => r.status !== 'cancelled' && r.checkout >= today);
  const past = myReservations.filter(r => r.status === 'cancelled' || r.checkout < today);

  const resCard = (res, dim) => `
    <div class="rounded-2xl overflow-hidden ${dim?'opacity-60':''}" style="background:#171612; border:1px solid rgba(200,146,42,0.18);">
      <div class="p-6">
        <div class="mb-4 flex items-center justify-between flex-wrap gap-2">
          <span class="inline-flex items-center gap-1.5 text-[10px] px-2.5 py-1 rounded-full tracking-wide"

            ● ${res.status[0].toUpperCase()+res.status.slice(1)} · ${res.reference}
          </span>
        </div>
        <h4 class="font-display text-cream text-xl">${res.roomName}</h4>
        <p class="text-dim text-xs mt-0.5">${res.roomType} · ${res.guests} Guests</p>
        <div class="grid grid-cols-3 gap-3 my-5">
          ${[["Check-in",res.checkin],["Check-out",res.checkout],["Duration",`${res.nights} Nights`]].map(([k,v])=>`
            <div><p class="text-dim text-[10px] mb-0.5 uppercase tracking-wider">${k}</p><p class="text-cream text-xs font-medium">${v}</p></div>`).join('')}

        <div class="flex items-center justify-between">
          <p class="text-dim text-sm">Total: <span class="font-display text-xl text-gold ml-1">$${res.total.toLocaleString()}</span></p>
          ${res.status==='confirmed' ? `<button onclick="cancelMyReservation('${res.id}')" class="text-xs text-dim px-3 py-1.5 rounded-lg hover:text-cream transition-colors" style="border:1px solid rgba(200,146,42,0.15);">Cancel</button>` : ''}
        </div>

async function cancelMyReservation(id){

function adminStats(){
  const active = allReservations.filter(r=>r.status!=='cancelled');
  const today = new Date().toISOString().slice(0,10);
  const todayCount = allReservations.filter(r=>r.checkin===today).length;
  const occupied = Object.values(roomStatus).filter(s=>s==='Occupied').length;
  const occRate = ROOMS.length ? Math.round((occupied/ROOMS.length)*100) : 0;
  const revenue = active.reduce((s,r)=>s+(r.total||0),0);
  const available = ROOMS.length - occupied;
  return { todayCount, occRate, revenue, available, total: ROOMS.length };
}

createReservationTransaction = async function(room,detail,guestInfo){
  if(!fbReady||!currentUser()) throw new Error("Please sign in before booking.");
  const nights=Math.max(1,Math.round((new Date(detail.checkout)-new Date(detail.checkin))/86400000));
  if(nights<1) throw new Error("Check-out must be after check-in.");
  const extras={breakfast:!!detail.breakfast,spa:!!detail.spa};
  const extrasPrice=(extras.breakfast?450:0)+(extras.spa?850:0);
  const subtotal=room.price*nights;
  const taxes=Math.round((subtotal+extrasPrice)*.12);
  const total=subtotal+extrasPrice+taxes;
  const reference=genReference();
  const reservationRef=db.collection("reservations").doc();
  const roomRef=db.collection("rooms").doc(String(room.id));
  const physicalQuerySnap=await db.collection("rooms").where("roomTypeId","==",room.id).get();
  const physicalRefs=physicalQuerySnap.docs.map(doc=>doc.ref);
  await db.runTransaction(async tx=>{
    const physicalDocs=await Promise.all(physicalRefs.map(ref=>tx.get(ref)));
    const requestedStart=new Date(`${detail.checkin}T00:00:00`).getTime(), requestedEnd=new Date(`${detail.checkout}T00:00:00`).getTime();
    const availablePhysical=physicalDocs.filter(doc => {
      const roomData=doc.data();
      if ((roomData.status || "Available") !== "Available") return false;
      return !(roomData.bookings || []).some(booking => {
        const start=new Date(`${booking.checkin}T00:00:00`).getTime(), end=new Date(`${booking.checkout}T00:00:00`).getTime();
        return requestedStart < end && requestedEnd > start;
      });
    });
    const snapshot=await tx.get(roomRef);
    const data=snapshot.exists?snapshot.data():{};
    const count=physicalDocs.length ? availablePhysical.length : Number(data.availabilityCount??room.availability??0);
    if(count<=0) throw new Error("This room is no longer available.");
    const assignedRoom=availablePhysical[0];
    if(physicalDocs.length && !assignedRoom) throw new Error("No physical room is available for these dates.");
    tx.set(roomRef,{availabilityCount:Math.max(0,count-1),status:count===1?"Occupied":"Available",updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
    if(assignedRoom){
      const assignedData=assignedRoom.data();
      tx.update(assignedRoom.ref,{status:"Occupied",bookings:[...(assignedData.bookings||[]),{reservationId:reservationRef.id,checkin:detail.checkin,checkout:detail.checkout}],updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
    }
    tx.set(reservationRef,{
      reference,reservationId:reservationRef.id,roomId:room.id,roomName:room.name,roomType:room.type,
      roomImage:room.img,destination:room.destination,location:room.location,roomTypeId:room.id,roomTypeName:room.name,
      assignedRoomId:assignedRoom ? assignedRoom.id : null,assignedRoomNumber:assignedRoom ? assignedRoom.data().roomNumber : null,
      guestUid:currentUser().uid,userId:currentUser().uid,guestName:guestInfo.name,leadGuest:guestInfo.name,
      guestEmail:guestInfo.email,contactNumber:guestInfo.contactNumber,checkin:detail.checkin,checkIn:detail.checkin,
      checkout:detail.checkout,checkOut:detail.checkout,checkinTime:detail.checkinTime||"15:00",
      nights,guests:detail.guests,extras,roomPrice:room.price,extrasPrice,subtotal,taxes,totalPrice:total,total,
      status:"pending",createdAtMs:Date.now(),createdAt:firebase.firestore.FieldValue.serverTimestamp(),
      updatedAt:firebase.firestore.FieldValue.serverTimestamp(),loyaltyPointsAwarded:false
    });
  });
  return reference;
};

async function adminUpdateReservation(id, status){
  if (!isAdmin()) throw new Error("Staff access required.");
  const item = allReservations.find(r => r.id === id);
  if (!item) throw new Error("Reservation not found.");
  if (status === "rejected" && !adminReservationCanDecide(item)) throw new Error("This reservation has already been decided.");
  if (status === "cancelled" && !adminReservationCanCancel(item)) throw new Error("This reservation cannot be cancelled.");
  await db.collection("reservations").doc(id).update({
    status,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
    ...(status === "checked-in" ? { checkedInAt: firebase.firestore.FieldValue.serverTimestamp() } : {}),
    ...(status === "checked-out" ? { checkedOutAt: firebase.firestore.FieldValue.serverTimestamp() } : {}),
    ...(status === "rejected" ? { cancellationReason:"Rejected by hotel staff", rejectedAt:firebase.firestore.FieldValue.serverTimestamp() } : {}),
    ...(status === "cancelled" ? { cancellationReason:"Cancelled by hotel staff", cancelledAt:firebase.firestore.FieldValue.serverTimestamp() } : {})
  });
  if (status === "rejected" || status === "cancelled") {
    const room = reservationRoom(item);
    if (room) await db.collection("rooms").doc(String(room.id)).set({
      availabilityCount: firebase.firestore.FieldValue.increment(1),
      status:"Available",
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge:true });
    await releasePhysicalBooking(item);
  }
  if (status === "checked-out") {
    await releasePhysicalBooking(item);
    await syncRoomTypeSummary(item.roomTypeId || item.roomId);
  }
  toast(status === "rejected" ? "Reservation rejected and room released." : status === "cancelled" ? "Booking cancelled and room released." : `Booking marked ${adminStatusLabels[status] || status}.`);
}

  const rooms = roomTypePhysicalRooms(selectedType.id);
  const color = status => status==="Available" ? "#34C759" : status==="Occupied" ? "#FF453A" : "#E8B84B";
  return `<div class="rounded-xl p-5 mb-6" style="background:#171612;border:1px solid rgba(200,146,42,.15)"><label class="text-dim text-xs uppercase tracking-wider">Room type<select onchange="setAdminRoomType(this.value)" class="block w-full md:w-96 mt-2 bg-[#0B0B09] text-cream rounded-lg p-3 outline-none">${ROOMS.map(room=>`<option value="${room.id}" ${String(room.id)===String(selectedType.id)?"selected":""}>${esc(room.name)}</option>`).join("")}</select></label><p class="text-dim text-sm mt-4">Physical rooms for ${esc(selectedType.name)}. Change each room's operational status using its dropdown.</p></div><div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 mb-8">${rooms.map(item=>{const status=item.status||"Available";return `<div class="rounded-xl p-5" style="background:#171612;border:1px solid ${color(status)}55"><div class="flex justify-between items-center"><span class="font-display text-xl text-cream">${esc(item.roomNumber)}</span><span class="text-xs" style="color:${color(status)}">● ${status}</span></div><label class="block text-dim text-xs mt-4">Room status<select onchange="adminSetPhysicalRoomStatus('${item.id}',this.value)" class="w-full mt-2 bg-[#0B0B09] text-cream text-sm rounded-lg p-2.5 outline-none">${["Available","Occupied","Cleaning"].map(option=>`<option ${status===option?"selected":""}>${option}</option>`).join("")}</select></label><p class="text-dim text-xs mt-3">${status==="Available"?"Ready to assign":"Operational status"}</p></div>`;}).join("")}</div>`;
}
async function adminSetPhysicalRoomStatus(roomId, next){
  const item=physicalRooms.find(room=>room.id===roomId);
  if(!item)return;
  if(!next)return;
  const status=String(next);
  if(!["Available","Occupied","Cleaning"].includes(status)){toast("Choose Available, Occupied, or Cleaning.");return;}
  try{await db.collection("rooms").doc(roomId).set({status,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});toast(`${item.roomNumber} marked ${status}.`);}catch(e){toast(e.message||"Unable to update room status.");}
}
function adminGuestProfileModal(user){
  if (!user) return "";
  const bookings = allReservations.filter(r => r.guestUid === user.id || r.userId === user.id);
  return `<div class="fixed inset-0 z-[90] flex items-center justify-center p-4" style="background:rgba(11,11,9,.84)" onclick="if(event.target===this)closeAdminGuest()"><div class="w-full max-w-lg max-h-[90vh] overflow-y-auto rounded-2xl p-6" style="background:#171612;border:1px solid rgba(200,146,42,.25)"><div class="flex justify-between items-start"><div><p class="text-gold text-xs uppercase tracking-wider">Guest profile</p><h3 class="font-display text-2xl text-cream mt-2">${esc(user.displayName||"Guest")}</h3><p class="text-dim text-sm mt-1">${esc(user.email||"Not specified")}</p></div><button onclick="closeAdminGuest()" class="text-dim">✕</button></div><div class="grid grid-cols-2 gap-3 mt-6 text-sm"><div><p class="text-dim text-xs">Date joined</p><p class="text-cream mt-1">${user.createdAt ? adminDate(user.createdAt.toDate ? user.createdAt.toDate().toISOString().slice(0,10) : user.createdAt) : "Not specified"}</p></div><div><p class="text-dim text-xs">Total bookings</p><p class="text-cream mt-1">${bookings.length}</p></div><div><p class="text-dim text-xs">Loyalty</p><p class="text-gold mt-1">${esc(user.membership||"Bronze")}</p></div><div><p class="text-dim text-xs">Points</p><p class="text-cream mt-1">${Number(user.loyaltyPoints||0).toLocaleString()}</p></div></div><h4 class="font-display text-xl text-cream mt-7 mb-3">Booking history</h4>${bookings.length ? `<div class="space-y-2">${bookings.map(r=>`<div class="rounded-lg p-3" style="background:#0B0B09"><div class="flex justify-between gap-3"><span class="text-cream text-sm">${esc(r.roomName||"Room")}</span><span class="text-gold text-xs">${adminStatusLabels[adminReservationStatus(r)]||adminReservationStatus(r)}</span></div><p class="text-dim text-xs mt-1">${adminDate(r.checkin||r.checkIn)} – ${adminDate(r.checkout||r.checkOut)}</p></div>`).join("")}</div>` : `<p class="text-dim text-sm">No bookings yet.</p>`}</div></div>`;
}
function adminGuestDirectory(){
  const query = adminSearch.guests.toLowerCase();
  const guests = allUsers
    .filter(user => !ADMIN_EMAILS.some(email => String(user.email || "").toLowerCase() === email.toLowerCase()))
    .filter(u => `${u.email||""} ${u.displayName||""}`.toLowerCase().includes(query));
  return `<div class="rounded-xl overflow-x-auto" style="border:1px solid rgba(200,146,42,.15);"><table class="w-full min-w-[760px] text-sm"><thead><tr style="background:#171612;border-bottom:1px solid rgba(200,146,42,.15);">${["Email","Date Joined","Total Bookings","Action"].map(h=>`<th class="text-left px-4 py-3 text-dim text-[11px] uppercase tracking-wider">${h}</th>`).join("")}</tr></thead><tbody>${guests.map(u=>{const bookings=allReservations.filter(r=>r.guestUid===u.id||r.userId===u.id).length;return `<tr style="border-bottom:1px solid rgba(200,146,42,.08)"><td class="px-4 py-3 text-cream">${esc(u.email||"Not specified")}</td><td class="px-4 py-3 text-dim">${u.createdAt ? adminDate(u.createdAt.toDate ? u.createdAt.toDate().toISOString().slice(0,10) : u.createdAt) : "Not specified"}</td><td class="px-4 py-3 text-cream">${bookings}</td><td class="px-4 py-3"><button onclick="openAdminGuest('${esc(u.id)}')" class="text-[11px] text-gold px-3 py-1.5 rounded-lg" style="border:1px solid rgba(200,146,42,.3)">View Profile</button></td></tr>`;}).join("")}</tbody></table></div>`;
}
function adminStats(){
  const today = new Date(); today.setHours(0,0,0,0);
  const week = new Date(today); week.setDate(week.getDate()+7);
  const upcoming = allReservations.filter(r=>{const d=new Date(`${r.checkin||r.checkIn}T00:00:00`);return !["cancelled","completed","checked-out"].includes(adminReservationStatus(r))&&d>=today&&d<week;}).length;
  return { upcoming, occupied:Object.values(roomStatus).filter(v=>v==="Occupied").length, cleaning:Object.values(roomStatus).filter(v=>v==="Cleaning").length, guests:allUsers.length };
}
function renderAdminView(){
  if (!isAdmin()) return renderAdminDeniedView();
  const sec=state.admin.section||"overview", stats=adminStats(), selected=state.admin.detailId ? allReservations.find(r=>r.id===state.admin.detailId) : null, selectedGuest=state.admin.guestId ? allUsers.find(user=>user.id===state.admin.guestId) : null;
  const nav = [["overview","Overview"],["reservations","Reservations"],["rooms","Rooms & Inventory"],["guests","Guest Directory"]];
  const heading={overview:"Dashboard overview",reservations:"Reservations management",rooms:"Room & inventory management",guests:"Guest directory"}[sec];
  const query=adminSearch.reservations.toLowerCase();
  const bookings=allReservations.filter(r=>`${r.guestName||r.leadGuest||""} ${r.guestEmail||""} ${r.roomName||""} ${r.status||""}`.toLowerCase().includes(query));
  return `<div class="pt-16 min-h-screen fade-in flex flex-col md:flex-row"><aside class="md:w-60 flex-shrink-0 p-4 md:p-6 md:min-h-[calc(100vh-4rem)]" style="border-right:1px solid rgba(200,146,42,.12);background:#0B0B09"><p class="text-gold text-[10px] uppercase tracking-[.2em] px-3">Staff console</p><p class="text-dim text-xs px-3 mt-1 mb-5">${esc(currentUser().email)}</p><div class="flex md:flex-col gap-1.5 overflow-x-auto">${nav.map(([id,label])=>`<button onclick="setAdminSection('${id}')" class="text-left whitespace-nowrap px-3 py-2.5 rounded-lg text-sm ${sec===id?"bg-gold text-surface font-semibold":"text-dim hover:text-cream"}">${label}</button>`).join("")}</div><button onclick="signOut()" class="text-red-300 text-xs px-3 py-2 mt-6">Sign out</button></aside><section class="flex-1 px-5 py-8 md:px-8 max-w-7xl"><p class="text-gold text-[10px] tracking-[.3em] uppercase mb-2">StayLink administration</p><h1 class="font-display text-4xl text-cream mb-7">${heading}</h1>${sec==="overview"?`<div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-10">${[["Upcoming bookings",stats.upcoming,"This week"],["Occupied rooms",stats.occupied,"Today"],["Rooms needing cleaning",stats.cleaning,"Current status"],["Registered guests",stats.guests,"All accounts"]].map(([label,value,note])=>`<div class="rounded-xl p-5" style="background:#171612;border:1px solid rgba(200,146,42,.15)"><p class="text-dim text-[11px] uppercase tracking-wider">${label}</p><p class="font-display text-3xl text-gold mt-2">${value}</p><p class="text-dim text-xs mt-1">${note}</p></div>`).join("")}</div><div class="flex flex-wrap gap-3 mb-8"><button onclick="setAdminSection('rooms')" class="px-4 py-3 rounded-lg bg-gold text-surface text-sm">Add New Room</button><button onclick="setAdminSection('reservations')" class="px-4 py-3 rounded-lg text-gold text-sm" style="border:1px solid rgba(200,146,42,.3)">View All Bookings</button></div><h2 class="font-display text-2xl text-cream mb-4">Latest bookings</h2>${adminReservationsTable(allReservations.slice(0,6))}`:sec==="reservations"?`<div class="flex flex-wrap gap-3 mb-5"><input value="${esc(adminSearch.reservations)}" oninput="setAdminSearch('reservations',this.value)" placeholder="Search guest, email, room, status" class="flex-1 min-w-[240px] bg-[#171612] text-cream text-sm rounded-lg p-3 outline-none" style="border:1px solid rgba(200,146,42,.2)"><select onchange="setAdminSearch('reservations',this.value)" class="bg-[#171612] text-cream text-sm rounded-lg p-3"><option value="">All statuses</option>${Object.entries(adminStatusLabels).map(([v,l])=>`<option value="${v}" ${adminSearch.reservations===v?"selected":""}>${l}</option>`).join("")}</select></div>${adminReservationsTable(bookings)}  `:sec==="rooms"?`<div class="flex items-center justify-between mb-4"><p class="text-dim text-sm">Live floor status and room settings</p><button onclick="toast('Use the room cards below to manage inventory.')" class="text-xs text-gold">Room settings help</button></div>${adminRoomsPanel()}`:`<div class="flex gap-3 mb-5"><input value="${esc(adminSearchDraft.guests||adminSearch.guests)}" oninput="setAdminSearchDraft('guests',this.value)" onkeydown="if(event.key==='Enter')applyAdminSearch('guests')" placeholder="Search guests by name or email" class="flex-1 bg-[#171612] text-cream text-sm rounded-lg p-3 outline-none" style="border:1px solid rgba(200,146,42,.2)"><button onclick="applyAdminSearch('guests')" class="px-5 py-3 rounded-lg bg-gold text-surface text-sm">Search</button></div>${adminGuestDirectory()}`}</section></div>${renderAdminReservationModal(selected)}${adminGuestProfileModal(selectedGuest)}`;
}
function setAdminSection(section){ state.admin.section=section; state.admin.detailId=null; render(); }
function renderTopNav(){
  const admin=isAdmin(), linksEl=document.getElementById("topnav-links"), profileSlot=document.getElementById("topnav-profile-slot"), u=currentUser();
  linksEl.innerHTML=(admin ? [["admin","Dashboard"]] : [["search","Discover"],["rooms","Rooms"],["reservations","My Stays"],["rewards","Rewards"]]).map(([v,label])=>`<button onclick="navigate('${v}')" class="text-sm tracking-wide ${state.view===v?"text-gold":"text-dim hover:text-cream"}">${label}</button>`).join("");
  profileSlot.innerHTML=u ? `<button onclick="${admin?"navigate('admin')":"navigate('profile')"}" class="flex items-center gap-2.5 text-sm text-dim"><div class="w-8 h-8 rounded-full flex items-center justify-center text-xs font-semibold text-gold" style="border:2px solid rgba(200,146,42,.35);background:#1E1C16">${esc((u.displayName||u.email||"?").charAt(0).toUpperCase())}</div><span class="hidden md:block">${esc(admin?"Admin":(u.displayName||u.email||"").split(" ")[0])}</span></button>`:`<button onclick="openAuth('login')" class="text-sm px-4 py-2 rounded-lg bg-gold text-surface font-semibold">Sign in</button>`;
  const items=admin ? [["admin","Dashboard","building"]] : [["search","Discover","building"],["rooms","Rooms","bed"],["reservations","My Stays","bookmark"],["rewards","Rewards","star"],["profile","Profile","user"]];
  document.getElementById("bottomnav").innerHTML=items.map(([v,label,icon])=>`<button onclick="navigate('${v}')" class="flex-1 flex flex-col items-center gap-1 py-3 text-[10px] ${state.view===v?"text-gold":"text-dim"}">${Ico[icon](20)}${label}</button>`).join("");
}
function navigate(v){
  if (isAdmin() && ["search","rooms","detail","reservations","profile","rewards"].includes(v)) {
    state.view="admin"; state.admin.section=v==="rooms"?"rooms":v==="reservations"?"reservations":v==="profile"?"guests":"overview"; render(); return;
  }
  if(v==="admin"){if(!currentUser()){openAuth("login");return;}if(!isAdmin()){state.view="admin-denied";render();return;}attachAllReservationsListener();attachAllUsersListener();state.view="admin";render();window.scrollTo({top:0,behavior:"instant"});return;}
  if((v==="reservations"||v==="rewards"||v==="profile")&&!currentUser()){openAuth("login");return;}
  if(v!=="detail")state.selectedRoomId=null;state.view=v;render();window.scrollTo({top:0,behavior:"instant"});
}
function render(){
  renderTopNav();renderAuthModal();const root=document.getElementById("app-root");let html="";
  switch(state.view){case"search":html=renderSearchView();break;case"rooms":html=renderRoomsView();break;case"detail":html=renderDetailView();break;case"reservations":html=renderReservationsView();break;case"profile":html=renderProfileView();break;case"rewards":html=renderRewardsView();break;case"admin":html=renderAdminView();break;case"admin-denied":html=renderAdminDeniedView();break;default:html=renderSearchView();}
  root.innerHTML=html;
}

/* ============================= BOOT ============================= */
function initApp(){
  try {
    if (window.firebase) {
      auth = firebase.auth();
      db = firebase.firestore();
      fbReady = true;
    }
  } catch (e) { console.warn("Firebase not initialized:", e); }

  render(); // first paint, works even if Firebase isn't ready

  if (fbReady){
    auth.onAuthStateChanged(user => {
      if (user){
        loadUserProfile();
        attachMyReservationsListener();
        if (isAdmin()) {
          attachAllReservationsListener();
          attachAllUsersListener();
          ensurePhysicalRooms().catch(error => console.warn("physical room setup error:", error));
          state.view = "admin";
        }
      } else {
        myReservations = [];
        allReservations = [];
        allUsers = [];
      }
      render();
    });
    attachRoomStatusListener();
  } else {
    console.log('Firebase SDK not active — likely opened outside Firebase Hosting (file:// or a non-Firebase server). Auth, reservations, and room status will not persist until deployed via `firebase deploy` or run with `firebase emulators:start`.');
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initApp);
} else {
  initApp();
}
</script>
</body>
</html>
